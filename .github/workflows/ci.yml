# Runs Polson's checks on every pull request to main and every push to main.
# Issue: https://github.com/shrooms08/polson/issues/5
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token; the workflow uses no secrets.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report both Node versions even if one fails.
      fail-fast: false
      matrix:
        # Lowest and newest supported versions (package.json "engines").
        node: ["20.19.0", "24"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
