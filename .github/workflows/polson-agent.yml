# Lets Polson's agent pick up a ticket without anyone prompting it.
#
# Label flow: ready-for-agent -> agent-working -> agent-done (PR opened, every
# check passed and Qodo's review record confirmed a real review; a human decides)
# or needs-human (stopped and needs a person).
#
# Four jobs:
#   agent        the phases below. It ends with candidate-done, never agent-done.
#   qodo-record  only after candidate-done: on a fresh runner, reads Qodo's own review
#                record for the head commit (issue #26).
#   verify-qodo  then sets agent-done or needs-human from that record.
#   hand-over    always runs last: a ticket still agent-working goes to a person.
#
# Phases of the agent job. The agent only does judgement work; scripts wait, loop,
# and decide. Scripts live in .github/polson/:
#   resume  phase.sh find-pr: reuse an open PR the agent opened from a branch named
#           <issue>-*. A matching PR opened by anyone else goes to a person.
#   build   agent (build-prompt.md): implement, test, push, open the PR. No waiting.
#   wait    phase.sh wait: wait-for-pr.sh polls CI and Qodo on the PR's head commit
#           every 60 seconds for up to 15 minutes, then a gate picks the next phase.
#   resolve agent (resolve-prompt.md): handle CI failures and Qodo findings, push
#           at most once, and report on the issue.
#   finish  phase.sh finish: candidate-done only if CI is green, Qodo finished, and
#           Qodo's comment lists no open High or Medium finding; otherwise needs-human.
# The wait and resolve pair runs at most twice (2 fix rounds), then a last wait.
# Steps cannot loop, so the rounds are written out: wait0, resolve1, after1,
# wait1, resolve2, after2, wait2, finish.
#
# claude-code-action only runs a workflow that is already on the default branch,
# so this workflow can only be tested after it is merged.
name: Polson agent

on:
  # A person adds ready-for-agent to an issue (filtered in the job's `if`).
  issues:
    types: [labeled]
  # Nightly at 01:17 UTC, which is 02:17 in Lagos (WAT, UTC+1, no daylight saving).
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to work on. It must be open and labelled ready-for-agent. Leave empty for the oldest such issue."
        required: false
        type: string

# One agent job at a time, across all triggers. A running job is never cancelled.
# GitHub keeps at most one waiting run per group, and a newer one replaces it. A
# replaced run never started, so its issue keeps ready-for-agent and the nightly
# run picks it up later.
concurrency:
  group: polson-agent
  cancel-in-progress: false

# The workflow token (GITHUB_TOKEN) gets only these permissions.
permissions:
  # Required by the action's documented setup. The agent pushes its ticket branch
  # with the Claude GitHub App token, which asks for contents: write itself. The
  # scripts use the workflow token only to fetch the PR branch.
  contents: write
  # Required by the action's documented setup, for opening and updating the PR.
  # The scripts use it to read the PR and Qodo's comments.
  pull-requests: write
  # The label swaps and the comments the scripts post use the workflow token.
  issues: write
  # Lets the action fetch a GitHub OIDC token and exchange it for the Claude
  # GitHub App token. Without it the action cannot authenticate to GitHub.
  id-token: write
  # Lets the agent read CI results for its PR (paired with additional_permissions).
  actions: read
  # Lets the wait script read the CI check runs on the PR's head commit.
  checks: read

jobs:
  agent:
    # On `issues` events, run only when a person (not a bot) added ready-for-agent.
    # Other label changes, including the agent's own, start no job.
    if: >-
      github.event_name != 'issues' ||
      (github.event.label.name == 'ready-for-agent' && github.event.sender.type == 'User')
    runs-on: ubuntu-latest
    # Time budget. Every step has its own limit, and the limits add up to 145
    # minutes, so the final hand-over step always starts before the job's 150
    # minutes run out (the rest covers job setup and post steps).
    #   setup: sweep 2, checkout 3, copy 1, Node 3, install 5, resolve 2,
    #          prompt 1, mark 1, resume check 1                            = 19
    #   build agent 20, keep its transcript 1, after-build 2               = 23
    #   3 waits x 17 (the script gives up after 15 minutes)                = 51
    #   2 resolve agents x 20, 2 keep transcript x 1, 2 after-resolve x 2  = 46
    #   finish 1, hand-over 3, transcript upload 2                         =  6
    # Steps that are skipped take no time, so most runs are much shorter.
    timeout-minutes: 150
    # For the verify-qodo and hand-over jobs. Set by the finish step only when every
    # check this job can make passed (candidate-done).
    outputs:
      issue: ${{ steps.resolve.outputs.number }}
      candidate: ${{ steps.finish.outputs.candidate }}
      pr: ${{ steps.finish.outputs.pr }}
      head_sha: ${{ steps.finish.outputs.head_sha }}
      ci_detail: ${{ steps.finish.outputs.ci_detail }}
      rounds: ${{ steps.finish.outputs.rounds }}
    env:
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Runs first and needs only gh, so a failed checkout or install cannot block it.
      # Only one job in the polson-agent group runs at a time, so an issue still
      # labelled agent-working now was left behind by an earlier run that stopped
      # before it could hand over (for example a hard cancel). Hand it to a person.
      - name: Hand over issues an earlier run left behind
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stranded=$(gh issue list --state open --label agent-working --limit 1000 --json number --jq '.[].number')
          for n in $stranded; do
            echo "::warning::#$n was left in agent-working by an earlier run. Handing it to a person."
            # Comment first: if the comment fails, the label stays and the next run retries.
            if gh issue comment "$n" --body "$(printf '%s\n\n%s' \
                "Polson's agent found this issue still labelled agent-working with no agent run in progress, so an earlier run stopped without handing it over. This needs a person; check the most recent Polson agent run for this issue." \
                "Found by: $RUN_URL")"; then
              gh issue edit "$n" --remove-label agent-working --add-label needs-human \
                || echo "::warning::Could not relabel #$n; the next run will retry."
            else
              echo "::warning::Could not comment on #$n; the next run will retry."
            fi
          done

      - name: Check out
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts and prompts run from this copy of the default branch's files,
      # so checking out a PR branch later cannot change them mid-run.
      - name: Keep a copy of the scripts and prompts
        timeout-minutes: 1
        # Owned by root and read-only, so the agents' file tools cannot change the
        # helpers they run (Claude Code's Write and Edit can reach paths outside the
        # working directory; the agent steps also deny them this directory).
        run: |
          rm -rf "${{ runner.temp }}/polson" && cp -R .github/polson "${{ runner.temp }}/polson"
          sudo chown -R root:root "${{ runner.temp }}/polson"
          sudo chmod -R a-w "${{ runner.temp }}/polson"

      - name: Set up Node 24
        timeout-minutes: 3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        timeout-minutes: 5
        run: npm ci

      - name: Resolve the issue number
        id: resolve
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            issues) n="$EVENT_ISSUE" ;;
            workflow_dispatch) n="${INPUT_ISSUE// /}" ;;
            *) n="" ;;
          esac

          if [ -n "$n" ] && ! [[ "$n" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::issue_number must be a positive whole number, got: $n"
            exit 1
          fi

          if [ -z "$n" ]; then
            n=$(gh issue list --state open --label ready-for-agent --limit 1000 \
              --json number,createdAt --jq 'sort_by(.createdAt) | .[0].number // empty')
            if [ -z "$n" ]; then
              echo "No open issue is labelled ready-for-agent. Nothing to do."
              echo "number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Check the issue's current state: another run may already have taken it.
          info=$(gh api "repos/$GH_REPO/issues/$n" \
            --jq '{open: (.state == "open"), pr: (.pull_request != null), ready: ([.labels[].name] | index("ready-for-agent") != null)}')
          if [ "$(jq -r '.open and (.pr | not) and .ready' <<<"$info")" != "true" ]; then
            echo "::notice::#$n is not an open issue labelled ready-for-agent ($info). Nothing to do."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Working on #$n"
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - name: Build the build-phase prompt
        id: build_prompt
        if: steps.resolve.outputs.number != ''
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
        run: bash "${{ runner.temp }}/polson/phase.sh" build-prompt "$ISSUE_NUMBER"

      - name: Mark the issue agent-working
        if: steps.resolve.outputs.number != ''
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
        run: |
          set -euo pipefail
          # Clear outcome labels a previous run left behind, so this run's ending is
          # the only one on the issue. Only labels that are present are removed, all
          # in the same edit as the swap; any failed GitHub call fails the step.
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          args=(--remove-label ready-for-agent --add-label agent-working)
          for stale in needs-human agent-done; do
            if grep -qx "$stale" <<<"$labels"; then args+=(--remove-label "$stale"); fi
          done
          gh issue edit "$ISSUE_NUMBER" "${args[@]}"

      # Phase: resume. An earlier run may have opened the PR already.
      - name: "Resume check: reuse an open PR for this issue"
        id: existing
        if: steps.resolve.outputs.number != ''
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
        run: bash "${{ runner.temp }}/polson/phase.sh" find-pr "$ISSUE_NUMBER"

      # Agent tool rules, for every agent step below:
      # --permission-mode default: deny every tool call that --allowedTools does
      # not cover, instead of letting auto mode's safety review decide.
      # No WebFetch, WebSearch, curl or similar: only gh and npm reach the network.
      # No `gh api`: it can call any endpoint, including merge and file writes.
      # No sleep: the agent never waits; the wait steps do.
      # The agent never runs git push. It runs the default branch's copy of
      # push-branch.sh (in runner.temp, not the checked-out file, which a PR branch
      # could replace) with its own issue number. That pushes the current branch to
      # the branch of the same name, and only if it is a ticket branch (<issue>-<slug>).
      # These rules narrow what the agent is asked and allowed to run. They are
      # not a sandbox: code the agent runs (npm test) holds the same token. Only
      # GitHub-side rules on main (the protect-main ruleset) can enforce "never
      # merge, never push to main" against that token.

      # Phase: build.
      - name: "Build: the agent implements the ticket and opens a PR"
        id: build
        if: steps.existing.outputs.next == 'build'
        timeout-minutes: 20
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          additional_permissions: |
            actions: read
          claude_args: |
            --permission-mode default
            --max-turns 150
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm ci),Bash(npm install),Bash(npm test),Bash(npm test:*),Bash(npm run typecheck),Bash(npm run report:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git branch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git restore:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git commit:*),Bash(bash ${{ runner.temp }}/polson/push-branch.sh ${{ steps.resolve.outputs.number }}),Bash(git pull:*),Bash(git fetch:*),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(gh api:*),Bash(gh pr merge:*),Bash(git merge:*),Bash(git push:*),Bash(sleep:*),Edit(./.github/**),Write(./.github/**),Edit(./.git/**),Write(./.git/**),Edit(/${{ runner.temp }}/**),Write(/${{ runner.temp }}/**)"

      # Keeps this agent step's transcript for the failure artifact below.
      - name: "Keep the build agent's transcript"
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        timeout-minutes: 1
        env:
          EXECUTION_FILE: ${{ steps.build.outputs.execution_file }}
        run: bash "${{ runner.temp }}/polson/keep-transcript.sh" build "$EXECUTION_FILE"

      - name: "Build: find the PR the agent opened"
        id: built
        if: steps.existing.outputs.next == 'build'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          AGENT_CONCLUSION: ${{ steps.build.outputs.conclusion }}
          AGENT_SKIPPED: ${{ steps.build.outputs.skipped_due_to_workflow_validation_mismatch }}
        run: bash "${{ runner.temp }}/polson/phase.sh" after-build "$ISSUE_NUMBER"

      # Phase: wait (round 0), then resolve round 1.
      - name: "Wait for CI and Qodo (before round 1)"
        id: wait0
        if: steps.existing.outputs.next == 'wait' || steps.built.outputs.next == 'wait'
        timeout-minutes: 17
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          PR: ${{ steps.built.outputs.pr || steps.existing.outputs.pr }}
          BRANCH: ${{ steps.built.outputs.branch || steps.existing.outputs.branch }}
        run: bash "${{ runner.temp }}/polson/phase.sh" wait "$ISSUE_NUMBER" 0

      - name: "Resolve round 1: the agent handles CI and Qodo results"
        id: resolve1
        if: steps.wait0.outputs.next == 'resolve'
        timeout-minutes: 20
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.wait0.outputs.prompt }}
          additional_permissions: |
            actions: read
          # Keep identical to resolve round 2.
          claude_args: |
            --permission-mode default
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm ci),Bash(npm install),Bash(npm test),Bash(npm test:*),Bash(npm run typecheck),Bash(npm run report:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git restore:*),Bash(git add:*),Bash(git commit:*),Bash(bash ${{ runner.temp }}/polson/push-branch.sh ${{ steps.resolve.outputs.number }}),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(gh api:*),Bash(gh pr merge:*),Bash(git merge:*),Bash(git push:*),Bash(sleep:*),Edit(./.github/**),Write(./.github/**),Edit(./.git/**),Write(./.git/**),Edit(/${{ runner.temp }}/**),Write(/${{ runner.temp }}/**)"

      # Keeps this agent step's transcript for the failure artifact below.
      - name: "Keep the round 1 resolver's transcript"
        if: always() && steps.resolve1.outcome != 'skipped' && steps.resolve1.outcome != ''
        timeout-minutes: 1
        env:
          EXECUTION_FILE: ${{ steps.resolve1.outputs.execution_file }}
        run: bash "${{ runner.temp }}/polson/keep-transcript.sh" resolve1 "$EXECUTION_FILE"

      - name: "After round 1: did the agent push a fix?"
        id: after1
        if: steps.wait0.outputs.next == 'resolve'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          PR: ${{ steps.wait0.outputs.pr }}
          HEAD_BEFORE: ${{ steps.wait0.outputs.head_sha }}
          AGENT_CONCLUSION: ${{ steps.resolve1.outputs.conclusion }}
          AGENT_SKIPPED: ${{ steps.resolve1.outputs.skipped_due_to_workflow_validation_mismatch }}
        run: bash "${{ runner.temp }}/polson/phase.sh" after-resolve "$ISSUE_NUMBER" 1

      # Phase: wait (round 1), then resolve round 2.
      - name: "Wait for CI and Qodo (before round 2)"
        id: wait1
        if: steps.after1.outputs.next == 'wait'
        timeout-minutes: 17
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          PR: ${{ steps.wait0.outputs.pr }}
          BRANCH: ${{ steps.wait0.outputs.branch }}
        run: bash "${{ runner.temp }}/polson/phase.sh" wait "$ISSUE_NUMBER" 1

      - name: "Resolve round 2: the agent handles CI and Qodo results"
        id: resolve2
        if: steps.wait1.outputs.next == 'resolve'
        timeout-minutes: 20
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.wait1.outputs.prompt }}
          additional_permissions: |
            actions: read
          # Keep identical to resolve round 1.
          claude_args: |
            --permission-mode default
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm ci),Bash(npm install),Bash(npm test),Bash(npm test:*),Bash(npm run typecheck),Bash(npm run report:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git restore:*),Bash(git add:*),Bash(git commit:*),Bash(bash ${{ runner.temp }}/polson/push-branch.sh ${{ steps.resolve.outputs.number }}),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(gh api:*),Bash(gh pr merge:*),Bash(git merge:*),Bash(git push:*),Bash(sleep:*),Edit(./.github/**),Write(./.github/**),Edit(./.git/**),Write(./.git/**),Edit(/${{ runner.temp }}/**),Write(/${{ runner.temp }}/**)"

      # Keeps this agent step's transcript for the failure artifact below.
      - name: "Keep the round 2 resolver's transcript"
        if: always() && steps.resolve2.outcome != 'skipped' && steps.resolve2.outcome != ''
        timeout-minutes: 1
        env:
          EXECUTION_FILE: ${{ steps.resolve2.outputs.execution_file }}
        run: bash "${{ runner.temp }}/polson/keep-transcript.sh" resolve2 "$EXECUTION_FILE"

      - name: "After round 2: did the agent push a fix?"
        id: after2
        if: steps.wait1.outputs.next == 'resolve'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          PR: ${{ steps.wait1.outputs.pr }}
          HEAD_BEFORE: ${{ steps.wait1.outputs.head_sha }}
          AGENT_CONCLUSION: ${{ steps.resolve2.outputs.conclusion }}
          AGENT_SKIPPED: ${{ steps.resolve2.outputs.skipped_due_to_workflow_validation_mismatch }}
        run: bash "${{ runner.temp }}/polson/phase.sh" after-resolve "$ISSUE_NUMBER" 2

      # Phase: last wait. Both fix rounds are used, so its gate always finishes.
      - name: "Wait for CI and Qodo (after round 2)"
        id: wait2
        if: steps.after2.outputs.next == 'wait'
        timeout-minutes: 17
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          PR: ${{ steps.wait1.outputs.pr }}
          BRANCH: ${{ steps.wait1.outputs.branch }}
        run: bash "${{ runner.temp }}/polson/phase.sh" wait "$ISSUE_NUMBER" 2

      # Phase: finish, from the latest wait's results (a skipped wait has none).
      - name: "Finish: candidate-done or needs-human"
        id: finish
        if: >-
          steps.after1.outputs.next == 'finish' ||
          steps.after2.outputs.next == 'finish' ||
          steps.wait2.outputs.next == 'finish'
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          PR: ${{ steps.wait2.outputs.pr || steps.wait1.outputs.pr || steps.wait0.outputs.pr }}
          HEAD_SHA: ${{ steps.wait2.outputs.head_sha || steps.wait1.outputs.head_sha || steps.wait0.outputs.head_sha }}
          CI: ${{ steps.wait2.outputs.ci || steps.wait1.outputs.ci || steps.wait0.outputs.ci }}
          CI_DETAIL: ${{ steps.wait2.outputs.ci_detail || steps.wait1.outputs.ci_detail || steps.wait0.outputs.ci_detail }}
          QODO: ${{ steps.wait2.outputs.qodo || steps.wait1.outputs.qodo || steps.wait0.outputs.qodo }}
          QODO_OPEN: ${{ steps.wait2.outputs.qodo_open || steps.wait1.outputs.qodo_open || steps.wait0.outputs.qodo_open }}
          FIXED1: ${{ steps.after1.outputs.fixed }}
          FIXED2: ${{ steps.after2.outputs.fixed }}
        run: bash "${{ runner.temp }}/polson/phase.sh" finish "$ISSUE_NUMBER"

      - name: Hand over to a person if the run did not finish
        # Runs even when an earlier step failed, timed out, or was cancelled. After
        # candidate-done it leaves the ticket to verify-qodo; the hand-over job below
        # catches a verify-qodo that never finishes.
        if: always() && steps.resolve.outputs.number != ''
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.number }}
          JOB_STATUS: ${{ job.status }}
          CANDIDATE: ${{ steps.finish.outputs.candidate }}
          STEPS: >-
            build: ${{ steps.build.outcome || 'not run' }},
            resolve round 1: ${{ steps.resolve1.outcome || 'not run' }},
            resolve round 2: ${{ steps.resolve2.outcome || 'not run' }}
        run: bash "${{ runner.temp }}/polson/hand-over.sh" agent "$ISSUE_NUMBER"

      # On failure or escalation only (anything but candidate-done), upload the
      # agents' transcripts so a person can see what the agent tried, including any
      # refused tool call. keep-transcript.sh redacted credential formats; this step
      # gets no token or secret in its environment. Diagnostics only: an upload
      # failure must not change the run's outcome, hence continue-on-error.
      - name: Upload the agent transcripts (failure or escalation only)
        if: always() && steps.resolve.outputs.number != '' && steps.finish.outputs.candidate != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polson-transcripts-issue-${{ steps.resolve.outputs.number }}-run-${{ github.run_id }}
          path: ${{ runner.temp }}/transcripts/
          if-no-files-found: ignore
          retention-days: 7

  # Qodo's PR comment cannot tell a skipped review from a real one; its own review
  # record can (issue #26). Reading the record needs QODO_API_KEY, a personal key
  # with the repo owner's full Qodo access, and runs Qodo's code (its installer and
  # CLI). Two jobs keep the key and Qodo's code away from anything that could misuse
  # them, and away from each other's credentials:
  #   qodo-record  reads the record. The only job with QODO_API_KEY. A fresh runner,
  #                so nothing agent-written code (npm test) left on the agent job's
  #                runner can read the key. No PR code: it checks out only
  #                .github/polson from the default branch. Its token can only read
  #                contents, no step gets GH_TOKEN, and the installer and CLI run
  #                with an environment allowlist.
  #   verify-qodo  decides and labels, with issues: write, but never runs Qodo's code
  #                and has no Qodo key. Right before it writes, it reads the labels
  #                and the PR head: still agent-working, still the head the agent
  #                job checked.
  # A ticket is reviewed only if Qodo's latest run is a completed, complete,
  # non-skipped review of that head. Anything else goes to a person.
  qodo-record:
    needs: agent
    if: needs.agent.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      run: ${{ steps.record.outputs.run }}
      effort: ${{ steps.record.outputs.effort }}
    steps:
      - name: Check out the scripts from the default branch
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          sparse-checkout: .github/polson
          persist-credentials: false

      - name: Set up Node 24 (the Qodo CLI runs on Node)
        timeout-minutes: 3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Make a temporary QODO_HOME
        timeout-minutes: 1
        run: echo "QODO_HOME=$(mktemp -d "$RUNNER_TEMP/qodo-home.XXXXXX")" >> "$GITHUB_ENV"

      # Qodo's published, immutable installer, checked against this SHA-256 before
      # it runs, pinned to one CLI version. Not secret.
      - name: Install the Qodo CLI
        timeout-minutes: 4
        env:
          QODO_INSTALLER_URL: https://get.qodo.ai/installers/9dfe51a938ac0b7e193d03a1acc7d5f4d35a829efff6aff79b3fd4114f17d8ff/install.sh
          QODO_INSTALLER_SHA256: 9dfe51a938ac0b7e193d03a1acc7d5f4d35a829efff6aff79b3fd4114f17d8ff
          QODO_CLI_VERSION: 2.4.0
        run: bash .github/polson/qodo-cli.sh install

      # Up to 5 reads a minute apart (the record can lag Qodo's comment). Worst
      # case: 5 x 60 s for the CLI's catalog check (30 s + 30 s) and one 60 s read,
      # or one catalog check and 5 reads, plus 4 x 60 s of waiting: 10 minutes,
      # inside 12 (test/agent-workflow.test.ts).
      - name: Read Qodo's review record for the head commit
        id: record
        timeout-minutes: 12
        env:
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.agent.outputs.pr }}
          HEAD_SHA: ${{ needs.agent.outputs.head_sha }}
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          QODO_BASE_URL: https://sdk.qodo.ai
          QODO_DISABLE_AUTOUPDATE: "1"
          QODO_DISABLE_SKILLS_AUTOUPDATE: "1"
          QODO_NO_KEYCHAIN: "1"
        run: PATH="$QODO_HOME/bin:$PATH" bash .github/polson/qodo-record.sh

      - name: Delete QODO_HOME
        if: always()
        timeout-minutes: 1
        run: rm -rf "${QODO_HOME:?}"

  verify-qodo:
    needs: [agent, qodo-record]
    if: needs.agent.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Check out the scripts from the default branch
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          sparse-checkout: .github/polson
          persist-credentials: false

      - name: "Verify: agent-done or needs-human"
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ needs.agent.outputs.issue }}
          PR: ${{ needs.agent.outputs.pr }}
          HEAD_SHA: ${{ needs.agent.outputs.head_sha }}
          CI_DETAIL: ${{ needs.agent.outputs.ci_detail }}
          ROUNDS: ${{ needs.agent.outputs.rounds }}
          QODO_RUN: ${{ needs.qodo-record.outputs.run }}
          QODO_EFFORT: ${{ needs.qodo-record.outputs.effort }}
        run: bash .github/polson/verify-qodo.sh "$ISSUE_NUMBER"

  # Always runs last, so a ticket is never left in agent-working: if qodo-record or
  # verify-qodo did not start, failed or was cancelled, the ticket goes to a person.
  hand-over:
    needs: [agent, qodo-record, verify-qodo]
    if: always() && needs.agent.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the hand-over script from the default branch
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          sparse-checkout: .github/polson
          persist-credentials: false

      - name: Hand over a ticket still in agent-working
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ needs.agent.outputs.issue }}
          AGENT_RESULT: ${{ needs.agent.result }}
          QODO_RECORD_RESULT: ${{ needs.qodo-record.result }}
          VERIFY_RESULT: ${{ needs.verify-qodo.result }}
        run: bash .github/polson/hand-over.sh final "$ISSUE_NUMBER"
