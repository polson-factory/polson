# Qodo configuration. Qodo reads this file from the default branch.
#
# Polson's builder agent opens its pull requests as a GitHub App (a bot account),
# and by default Qodo does not review pull requests opened by bots. The scripted
# finish in .github/workflows/polson-agent.yml waits for Qodo's review, so let
# Qodo review bot-authored pull requests. Documented at
# https://docs.qodo.ai/code-review/ignore-content-from-analysis
[github_app]
ignore_bot_pr = false

# Repository-specific review instructions (Day 11). These are the documented
# [review_agent] settings "issues_user_guidelines" (extra instructions for the
# Issue finding agent: bugs, security, performance) and
# "compliance_user_guidelines" (extra instructions for the Compliance agent: rule
# checking), from https://docs.qodo.ai/configuration/configuration-and-command-reference
# A repository-root .pr_agent.toml overrides the same settings in the Qodo portal.
# The review preset and the rules are not changed here.
[review_agent]
issues_user_guidelines = '''
Polson has two kinds of pull request author.
1. The unattended builder agent: pull requests opened by claude[bot], from branches named <issue>-<slug>, run by .github/workflows/polson-agent.yml. It must never edit anything under .github/.
2. Owner-supervised sessions: pull requests opened by shrooms08. These may edit .github/; the owner reviews and merges them. Do not flag a shrooms08 pull request for editing .github/. A Co-Authored-By: Claude trailer or a "Generated with Claude Code" line on a shrooms08 pull request does not mean the unattended agent made the change.

Flag as High (Action required) any change that gives the unattended builder agent a new way to: merge a pull request; push to main; choose where a push goes; run a script from a branch it checked out; or read a secret. To find these, check: the agent steps' --allowedTools and --disallowedTools in .github/workflows/polson-agent.yml; workflow and job permissions; which jobs and steps receive which tokens and secrets (github.token, GH_TOKEN, CLAUDE_CODE_OAUTH_TOKEN, QODO_API_KEY); whether scripts run from the trusted copy in runner.temp (taken from the default branch) or from the checked-out branch; .github/polson/push-branch.sh; and the boundaries between the agent, qodo-record, verify-qodo and hand-over jobs.
'''
compliance_user_guidelines = '''
Polson has two kinds of pull request author. The unattended builder agent (pull requests opened by claude[bot], run by .github/workflows/polson-agent.yml) must never edit .github/. Owner-supervised sessions (pull requests opened by shrooms08) may edit .github/; the owner reviews and merges them. When a rule or ticket says .github/ changes need a person, a shrooms08 pull request meets it: do not flag a shrooms08 pull request for editing .github/. A Co-Authored-By: Claude trailer or a "Generated with Claude Code" line on a shrooms08 pull request does not mean the unattended agent made the change.
'''
